<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 224 224" width="256" height="256">
  <!-- 画布裁切到底板边界（16..240），使图案铺满整个画布 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF4FA"/>
      <stop offset="0.55" stop-color="#CDE3F0"/>
      <stop offset="1" stop-color="#ADD6E8"/>
    </linearGradient>

    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="0.45" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底板：浅色背景 -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>

  <!-- 闪电：居中 -->
  <path d="M144.8 51 L102.8 126.6 H128 L97.2 205 L158.8 115.4 H133.6 L153.2 51 Z"
        fill="url(#bolt)" stroke="#FFF3B0" stroke-width="2"
        stroke-linejoin="round" filter="url(#glow)"/>
</svg>